  <title>Roku Simulator</title>
  <style>
    /* The real Roku UI faces, supplied with the project */

    @font-face { font-family: "RokuText"; src: url(fonts/RokuText-Medium.woff2) format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
    @font-face { font-family: "RokuText"; src: url(fonts/RokuText-Bold.woff2) format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
    @font-face { font-family: "RokuText"; src: url(fonts/RokuText-BoldItalic.woff2) format("woff2"); font-weight: 700; font-style: italic; font-display: block; }
    @font-face { font-family: "RokuDisplay"; src: url(fonts/RokuDisplay-Bold.woff2) format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
  </style>

      --dim: #9c91ad;          /* unselected nav label + icon  */
      --dimmer: #464151;       /* "Search" row                 */
      --label: #d4c9e8;        /* row headings + counter       */
      --clock: #e8e2f6;        /* clock + top-bar text         */
      --onpill: #140628;       /* selected nav label on pill   */
      --ring: #c9c9cd;         /* focus ring                   */
      --ui: "RokuText", "Gotham SSm A", "Gotham", "Segoe UI", system-ui, sans-serif;

      --content-x: 590px;      /* content column, sidebar focused */
      --icon-x: 86px;

      /* Timings measured off the 60fps capture. The UI renders at 30fps, so
         each transition lands as nine discrete steps; fitting those gives
         cubic-bezier(.30,.82,.62,1) with an rmse of 0.002 over two
         independent scrolls. Scroll/ring/reflow run 300ms; the sidebar
         collapse in ref_01.mp4 measures nearer 200ms. */
      --ease: cubic-bezier(.3, .82, .62, 1);
      --dur: .3s;              /* scroll, ring, row reflow     */
      --zdur: .2s;             /* sidebar <-> content          */
      --fade: .07s;            /* chrome fading in             */
      --fadeout: .05s;         /* text clearing before a swap  */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      letter-spacing: -.03em;   /* matches the reference's tracking */
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: var(--ui);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    #fit { position: fixed; inset: 0; overflow: hidden; }

    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1280px;
      height: 720px;
      transform-origin: 0 0;
      overflow: hidden;
      user-select: none;
      background: #000;
    }

    .stage:focus { outline: none; }

    /* focus inside the content area: the rail collapses and the rows slide left */
    .stage[data-zone="content"] {
      --content-x: 156px;
      --icon-x: 66px;
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .screen.on { opacity: 1; pointer-events: auto; }

    /* ---------- home background (radial profile sampled from the ref) ---- */

    #home {
      background: radial-gradient(circle 760px at 50% 0%,
          #6c2ac4 0px, #6027b3 70px, #5e26ab 90px, #5b23a6 110px,
          #5722a1 130px, #541f9a 150px, #4f1e93 170px, #4d1d8b 190px,
          #491a85 210px, #441b7f 230px, #421775 250px, #3a1a70 270px,
          #391669 290px, #361464 310px, #31155e 330px, #2d1156 350px,
          #2b1052 370px, #290e4c 390px, #240d47 410px, #200b43 430px,
          #1e0c3c 450px, #1a0838 470px, #190931 490px, #14072c 510px,
          #130629 530px, #110525 550px, #100520 570px, #0d041e 590px,
          #09031a 610px, #070116 630px, #060113 660px, #050012 690px,
          #04000f 710px, #03010d 750px);
    }

    /* ---------- top bar -------------------------------------------------- */

    .wordmark {
      position: absolute;
      left: 64px;
      top: 38px;
      width: 100px;
      height: 38px;
      pointer-events: none;
    }

    .crumb {
      position: absolute;
      left: 174px;
      top: 36px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 29px;
      font-weight: 400;
      color: #fff;
      white-space: nowrap;
      opacity: 0;
      transition: opacity var(--fade) linear;
    }

    .stage[data-zone="content"] .crumb { opacity: 1; }

    .dot { color: #7c7290; font-size: 12px; line-height: 0; }

    .topright {
      position: absolute;
      right: 64px;
      top: 33px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 21px;
      color: var(--clock);
      white-space: nowrap;
    }

    .optshint {
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      transition: opacity var(--fade) linear;
    }

    .stage[data-zone="content"] .optshint { opacity: 1; }
    .optshint .star { font-size: 25px; line-height: 0; position: relative; top: 2px; }

    /* ---------- sidebar --------------------------------------------------- */

    /* The sidebar is an endless carousel: the selected row parks at y=161
       and the list runs on past Settings, back round to Home, with a rule
       marking the seam. Nothing is drawn above the selected row, and the
       column fades out below (measured: full to y=399, gone by y=507),
       which is why the last visible row looks dimmed. */
    .sidebar {
      position: absolute;
      inset: 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 160px, #000 160px, #000 399px, transparent 507px);
      mask-image: linear-gradient(to bottom, transparent 160px, #000 160px, #000 399px, transparent 507px);
    }

    .navstrip {
      position: absolute;
      left: 0;
      top: 161px;
      width: 100%;
      transition: transform var(--zdur) var(--ease);
    }

    .navstrip.nojump { transition: none; }

    .navseam {
      position: absolute;
      left: 79px;
      width: 436px;
      height: 2px;
      background: rgba(255, 255, 255, .3);
    }

    .navitem {
      position: absolute;
      left: 64px;
      width: 466px;
      height: 56px;
      border-radius: 6px;
      cursor: pointer;
      transition: width var(--zdur) var(--ease);
    }

    /* ---------- content --------------------------------------------------- */

    /* Rows scroll up and disappear behind y=160 -- the line the focused row
       parks on. Measured: no row pixel is ever drawn above it, while the
       heading, counter and focus ring all are, so those sit outside. */
    .viewport {
      position: absolute;
      left: var(--content-x);
      top: 0;
      width: 624px;
      height: 720px;
      clip-path: inset(160px 0 0 0);
      transition: left var(--zdur) var(--ease);

    .chrome {
      position: absolute;
      left: var(--content-x);

      top: 0;

    .row { position: absolute; left: 0; width: 624px; transition: top var(--dur) var(--ease); }

    .rowlabel {
      transition: opacity var(--fadeout) linear;
      position: absolute;
      left: 1px;
      top: -30px;

    .counter {

      right: 0;
      top: 130px;

      line-height: 18px;
      color: var(--label);
      white-space: nowrap;
      display: none;

    .counter.on { display: block; }

    .grid { position: relative; }

    .tile {
      position: absolute;
      cursor: pointer;
      border-radius: 2px;
    }

    .tile img { display: block; width: 100%; height: 100%; border-radius: 2px; }

    .tile.fx .play { opacity: 1; }

    /* The ring is one element that slides and resizes between tiles rather
       than appearing on each one (measured in the capture: it travels with
       the same curve as the scroll). */
    .ring {

      border: 5px solid var(--ring);
      border-radius: 7px;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
      transition: left var(--dur) var(--ease), top var(--dur) var(--ease),
                  width var(--dur) var(--ease), height var(--dur) var(--ease),
                  opacity var(--fade) linear;
    }

    .ring.on { opacity: 1; }
    .ring.nojump { transition: opacity var(--fade) linear; }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 66px;
      height: 66px;
      margin: -33px 0 0 -33px;
      border-radius: 50%;
      border: 3px solid rgba(233, 233, 240, .92);
      background: rgba(0, 0, 0, .3);
      opacity: 0;
      transition: opacity var(--fade) linear;
      pointer-events: none;
    }

    .play::after {
      content: "";
      position: absolute;
      left: 23px;
      top: 16px;
      border-left: 22px solid #fff;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
    }

    /* programme info under the focused row */

    .metabox { position: absolute; left: 0; width: 624px; display: none; transition: opacity var(--fadeout) linear; }
    .row.fxrow .metabox.on { display: block; }

    .metabox .t { position: absolute; left: 0; top: 0; font-size: 22px; font-weight: 500; line-height: 22px; white-space: nowrap; }
    .metabox .s { position: absolute; left: 0; top: 30px; font-size: 18px; line-height: 18px; color: #bdb5cb; white-space: nowrap; }

    .panes { position: absolute; inset: 0; pointer-events: none; }

      function navItem() { return NAV[state.nav % NAV.length]; }

      function gridH(row) { return row.nRows * row.tileH + (row.nRows - 1) * row.rowGap; }

      function tileBox(row, t) {
        var x = 0, i;
        for (i = 0; i < t.col; i++) x += row.cols[i] + row.colGap;

      var rowEls = $('content').querySelectorAll('.row');

      /* ---------------- render ---------------- */

      function show(name) {

      function render(nojump, immediate, navjump) {
        stage.dataset.zone = state.zone;

        var items = $('navstrip').querySelectorAll('.navitem'), i;
        for (i = 0; i < items.length; i++) items[i].classList.toggle('sel', i === state.nav);

        var fRow = ROWS[state.row];

        var shift = 0;

        var ring = $('ring');
        ring.classList.toggle('on', !!ft);

      /* ---------------- actions ---------------- */

      function enterContent() {

      }

      function activateNav() {

        else if (n.id === 'search') show('search');

      function ok() {
        if ($('options').classList.contains('on')) { $('options').classList.remove('on'); return; }

          else { var t = focusedTile(); if (t) openApp(t.title); }
        } else if (state.screen === 'inputs') {
          var inp = INPUTS[state.inputIdx];

            ? 'No signal detected on ' + inp.label + '. Press <kbd>Esc</kbd> to choose another input.'

        } else if (state.screen === 'search') typeKey();

      function typeKey() {
        var c = KEYCHARS[state.keyIdx];

        else if (c === 'DELETE') state.query = state.query.slice(0, -1);

      function updateResults() {
        var q = state.query.trim().toLowerCase();
        if (!q) { $('results').textContent = 'Start typing to see results.'; return; }
        var seen = {}, hits = [];
        ROWS.forEach(function (r) {
          r.tiles.forEach(function (t) {
            var plain = t.title.replace(/&amp;/g, '&');
            if (plain.toLowerCase().indexOf(q) > -1 && !seen[plain]) { seen[plain] = 1; hits.push(plain); }
          });
        });
        $('results').innerHTML = hits.length
          ? 'Results: ' + hits.map(function (h) { return '<b style="color:#fff;font-weight:500">' + h + '</b>'; }).join(' &nbsp;&#9679;&nbsp; ')
          : 'No results for &ldquo;' + state.query + '&rdquo;.';
      }

      function back() {
        if ($('options').classList.contains('on')) { $('options').classList.remove('on'); return; }
        if (state.screen !== 'home') { clearTimeout(launchTimer); show('home'); return; }
        if (state.zone === 'content') { state.zone = 'nav'; state.ghost = false; render(true, true); }
      }

      function goHome() {
        clearTimeout(launchTimer);
        $('options').classList.remove('on');
        state.zone = 'nav'; state.nav = NAV.length * 2; state.row = 0; state.r = 0; state.c = 0; state.ghost = false;
        show('home');
      }

      function toggleOptions() {
        var o = $('options');
        if (o.classList.contains('on')) { o.classList.remove('on'); return; }
        state.optIdx = 0;
        var ft = state.zone === 'content' ? focusedTile() : null;
        $('optCtx').innerHTML = state.screen === 'home'
          ? (ft ? ft.title : 'Home screen')
          : navItem().label;
        o.classList.add('on');
        render();
      }

      /* ---------------- movement ---------------- */

      var ghostTimer = null, navTimer = null, navSeq = 0, ghostSeq = 0;

      /* Map the index back onto the middle copy. The copies are identical, so
         doing this at rest moves nothing on screen. */
      function navRebase() {
        var mid = NAV.length * 2 + ((state.nav % NAV.length) + NAV.length) % NAV.length;
        if (mid === state.nav) return false;
        state.nav = mid;
        return true;
      }

      /* The looped copy of the first row is only a stand-in; drop back onto
         the real one before doing anything else with it. */
      function settleGhost() {
        if (!state.ghost) return;
        clearTimeout(ghostTimer);
        state.ghost = false;
        render(true);
      }

      function gotoRow(ri, fromBottom) {
        var row = ROWS[ri];
        state.row = ri;
        state.r = fromBottom ? row.nRows - 1 : 0;
        state.c = Math.min(state.c, row.cols.length - 1);
        if (cellAt(row, state.r, state.c) < 0) state.c = 0;
      }

      function moveContent(dir) {
        if (state.ghost && dir !== 'down') settleGhost();
        var row = ROWS[state.row], i;
        if (dir === 'left' || dir === 'right') {
          var step = dir === 'left' ? -1 : 1;
          var cur = cellAt(row, state.r, state.c), c = state.c + step;
          while (c >= 0 && c < row.cols.length) {
            var t = cellAt(row, state.r, c);
            if (t >= 0 && t !== cur) { state.c = c; render(); return; }
            c += step;
          }
          if (dir === 'left') { state.zone = 'nav'; state.ghost = false; render(true, true); }
          return;
        }

        if (state.ghost) { settleGhost(); row = ROWS[state.row]; }

        if (dir === 'down') {
          if (state.r < row.nRows - 1) { state.r++; render(); return; }
          if (state.row < ROWS.length - 1) { gotoRow(state.row + 1, false); render(); return; }
          /* off the end: scroll onto the looped copy of the first row, then
             silently rebase onto the real one (identical on screen) */
          state.ghost = true;
          gotoRow(0, false);
          render();
          clearTimeout(ghostTimer);
          var gseq = ++ghostSeq;
          ghostTimer = setTimeout(function () {
            if (gseq === ghostSeq) settleGhost();
          }, 320);
          return;
        }

        if (state.r > 0) { state.r--; render(); return; }
        if (state.row > 0) { gotoRow(state.row - 1, true); render(); return; }
        gotoRow(ROWS.length - 1, true);          /* wrap to the bottom */
        render(true);
      }

      function move(dir) {
        if ($('options').classList.contains('on')) {
          if (dir === 'up') state.optIdx = Math.max(0, state.optIdx - 1);
          if (dir === 'down') state.optIdx = Math.min(OPTIONS.length - 1, state.optIdx + 1);
          render();
          return;
        }

        if (state.screen === 'home') {
          if (state.zone === 'nav') {
            if (dir === 'up' || dir === 'down') {
              state.nav += dir === 'down' ? 1 : -1;
              /* Only snap back to the middle copy if we are about to run off
                 the strip -- otherwise the index just drifts and is rebased
                 once the key is released, where it costs nothing on screen. */
              var span = NAV.length * NAV_COPIES;
              if (state.nav < 0 || state.nav >= span) { navRebase(); render(true, false, true); }
              else render();
              clearTimeout(navTimer);
              var seq = ++navSeq;
              navTimer = setTimeout(function () {
                if (seq !== navSeq) return;             /* a newer move won */
                if (navRebase()) render(true, false, true);
              }, 240);
              return;
            }
            else if (dir === 'right' && navItem().id === 'home') { enterContent(); return; }
            render();
          } else moveContent(dir);
          return;
        }

        if (state.screen === 'inputs') {
          if (dir === 'left') state.inputIdx = Math.max(0, state.inputIdx - 1);
          if (dir === 'right') state.inputIdx = Math.min(INPUTS.length - 1, state.inputIdx + 1);
          render();
          return;
        }

        if (state.screen === 'search') {
          var i = state.keyIdx;
          if (dir === 'left') i = Math.max(0, i - 1);
          if (dir === 'right') i = Math.min(KEYCHARS.length - 1, i + 1);
          if (dir === 'up') i = Math.max(0, i - 10);
          if (dir === 'down') i = Math.min(KEYCHARS.length - 1, i + 10);
          state.keyIdx = i;
          render();
        }
      }

      /* ---------------- input ---------------- */

      function press(key) {
        wake();
        switch (key) {
          case 'up': case 'down': case 'left': case 'right': move(key); break;
          case 'ok': ok(); break;
          case 'back': back(); break;
          case 'home': goHome(); break;
          case 'options': toggleOptions(); break;
          case 'full': toggleFullscreen(); break;
        }
      }

      var KEYMAP = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        Enter: 'ok', ' ': 'ok', Backspace: 'back', Escape: 'back',
        h: 'home', H: 'home', '*': 'options', f: 'full', F: 'full'
      };

      window.addEventListener('keydown', function (e) {
        var k = KEYMAP[e.key];
        if (!k) { wake(); return; }
        e.preventDefault();
        press(k);
      });

      stage.addEventListener('click', function (e) {
        wake();
        var navEl = e.target.closest('[data-nav]');
        if (navEl) { state.nav = +navEl.dataset.nav; state.zone = 'nav'; render(); activateNav(); return; }

        var tileEl = e.target.closest('[data-t]');
        if (tileEl) {
          var p = tileEl.dataset.t.split('.'), ri = +p[0], ti = +p[1];
          var row = ROWS[ri], t = row.tiles[ti];
          var same = state.zone === 'content' && focusedTile() === t;
          state.zone = 'content'; state.ghost = false;
          state.row = ri; state.r = t.row; state.c = t.col;
          render();
          if (same) openApp(t.title);
          return;
        }

        var inpEl = e.target.closest('[data-input]');
        if (inpEl) { state.inputIdx = +inpEl.dataset.input; render(); ok(); return; }
        var keyEl = e.target.closest('[data-key-i]');
        if (keyEl) { state.keyIdx = +keyEl.dataset.keyI; typeKey(); return; }
        var optEl = e.target.closest('[data-opt]');
        if (optEl) { state.optIdx = +optEl.dataset.opt; render(); ok(); }
      });

      /* ---------------- clock ---------------- */

      function tickClock() {
        var d = new Date(), h = d.getHours(), ap = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        $('clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + ap;
      }
      tickClock();
      setInterval(tickClock, 15000);

      /* ---------------- screensaver ---------------- */

      var idleTimer = null, raf = null, bx = 120, by = 90, vx = 1.6, vy = 1.2, beforeSaver = null;
      var HUES = ['#662d91', '#2d6b91', '#91452d', '#2d914f', '#912d6b'];

      function animateSaver() {
        var el = $('bounce'), w = el.offsetWidth, h = el.offsetHeight;
        bx += vx; by += vy;
        if (bx <= 0) { bx = 0; vx = -vx; recolor(el); }
        if (bx + w >= 1280) { bx = 1280 - w; vx = -vx; recolor(el); }
        if (by <= 0) { by = 0; vy = -vy; recolor(el); }
        if (by + h >= 720) { by = 720 - h; vy = -vy; recolor(el); }
        el.style.transform = 'translate(' + bx + 'px,' + by + 'px)';
        raf = requestAnimationFrame(animateSaver);
      }

      function recolor(el) { el.style.background = HUES[Math.floor(Math.random() * HUES.length)]; }

      function sleep() {
        if (state.screen === 'saver') return;
        beforeSaver = state.screen;
        show('saver');
        raf = requestAnimationFrame(animateSaver);
      }

      function wake() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(sleep, 60000);
        if (state.screen === 'saver') { cancelAnimationFrame(raf); show(beforeSaver || 'home'); }
      }

      stage.addEventListener('mousemove', wake);

      /* ---------------- fullscreen + fit ---------------- */

      function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      }

      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var s = Math.min(w / 1280, h / 720);
        var tx = Math.round((w - 1280 * s) / 2), ty = Math.round((h - 720 * s) / 2);
        stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px)' + (s === 1 ? '' : ' scale(' + s + ')');
      }

      window.addEventListener('resize', fit);
      fit();

      /* deep links for screenshots: #content, #content=row.r.c, #search, #inputs */
      var hash = location.hash.slice(1);
      if (hash.indexOf('content') === 0) {
        state.zone = 'content';
        var at = hash.split('=')[1];
        if (at) {
          var n = at.split('.');
          state.row = +n[0] || 0; state.r = +n[1] || 0; state.c = +n[2] || 0;
        }
      } else if (hash === 'search' || hash === 'inputs') {
        NAV.forEach(function (n, i) { if (n.id === hash) state.nav = NAV.length * 2 + i; });
        show(hash);
      }

      render(true, true);
      wake();
      stage.focus();
    })();
  </script>
</body>

</html>
